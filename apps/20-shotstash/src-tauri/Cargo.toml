[package]
name = "shotstash"
version = "0.1.0"
description = "Privacy-first screenshot manager with local OCR search"
edition = "2021"

[lib]
name = "shotstash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
image = "0.25"
notify = "7"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# OCR: platform-native bindings gated per-OS; tesseract fallback
[target.'cfg(target_os = "linux")'.dependencies]
tesseract = "0.15"
