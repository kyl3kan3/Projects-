[project]
name = "parseflow"
version = "0.1.0"
description = "Document-parsing API: PDFs and images to structured JSON with confidence scores"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
